<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffe5ef" />

    <title>Uma pergunta especial 💗</title>

    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <main class="cartao">
      <div class="coracao" aria-hidden="true">♡</div>

      <h1>Quer namorar comigo?</h1>

      <p class="introducao">
        Tenho uma pergunta muito especial pra te fazer... 💗
      </p>

      <div class="botoes">
        <button id="sim" type="button">Sim! ❤️</button>
        <button id="nao" type="button">Não 🙈</button>
      </div>

      <section id="mensagem" hidden aria-live="polite">
        <h2>AAAAA, EU TE AMO! 💗</h2>

        <img
          src="gatinhos.png"
          alt="Dois gatinhos apaixonados"
          class="gatinhos"
        />

        <p><strong>Agora somos um casal! 🥹❤️</strong></p>

        <p>
          Quero viver muitos momentos lindos contigo! Que essa seja uma história
          cheia de carinho, risadas e lembranças especiais. 💕
        </p>

        <div class="coracao-final" aria-hidden="true">♡</div>
      </section>

      <footer>Feito com carinho, especialmente pra ti 💌</footer>
    </main>
  </body>
</html>
